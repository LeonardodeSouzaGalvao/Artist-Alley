# Para rodar, basta entrar na pasta infra e usar o comando docker compose up -d. O painel do RabbitMQ ficará em http://localhost:15672

version: '3.8'

services:
  database:
    image: postgres:15
    container_name: artishub_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: artishub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: artishub_mq
    restart: always
    ports:
      - "5672:5672"   # Porta do protocolo AMQP
      - "15672:15672" # Painel administrativo (acesso via browser)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  postgres_data: